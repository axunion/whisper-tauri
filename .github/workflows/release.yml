name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      mode:
        description: "Build mode"
        required: true
        default: "build-only"
        type: choice
        options:
          - build-only
          - release

jobs:
  release:
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || format('v{0}-test', github.run_number) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin --bundles app"
          - platform: ubuntu-22.04
            args: "--bundles deb,appimage"
          - platform: windows-latest
            args: "--bundles nsis"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust target (macOS)
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: Set reproducible build environment
        run: echo "SOURCE_DATE_EPOCH=$(date +%s)" >> $GITHUB_ENV

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build only
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'build-only'
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      - name: Build and release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release')
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "Whisper Tauri ${{ env.RELEASE_TAG }}"
          releaseBody: |
            ## Installation

            ### macOS (Apple Silicon)
            1. Download `Whisper-Tauri-aarch64.zip`
            2. Double-click to extract — a folder "Whisper Tauri Installer" appears
            3. Double-click `Install.command` — macOS warns it could not verify the file; click **Done**
            4. System Settings → Privacy & Security → **Open Anyway**, then authenticate
            5. Terminal installs the app to `/Applications` and launches it (no warning afterwards)

            ### Windows
            Download the `.exe` installer from the assets below and follow the prompts. SmartScreen warning is expected for unsigned builds.

            ### Linux
            - **Debian/Ubuntu**: install the `.deb` package
            - **Other distros**: download the `.AppImage`, `chmod +x`, and run it

            See [docs/install.md](https://github.com/${{ github.repository }}/blob/main/docs/install.md) for SmartScreen / Gatekeeper warnings and uninstall instructions.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Create installer zip (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          APP_NAME=$(jq -r .productName src-tauri/tauri.conf.json)
          APP_BUNDLE="$APP_NAME.app"
          BUNDLE_DIR="src-tauri/target/aarch64-apple-darwin/release/bundle/macos"
          if [ ! -d "$BUNDLE_DIR/$APP_BUNDLE" ]; then
            echo "App bundle not found at $BUNDLE_DIR/$APP_BUNDLE"
            ls -la "$BUNDLE_DIR" || true
            exit 1
          fi
          STAGING=$(mktemp -d)
          PKG_NAME="$APP_NAME Installer"
          PKG_DIR="$STAGING/$PKG_NAME"
          mkdir -p "$PKG_DIR"
          cp -R "$BUNDLE_DIR/$APP_BUNDLE" "$PKG_DIR/"
          cp src-tauri/scripts/Install.command "$PKG_DIR/"
          chmod +x "$PKG_DIR/Install.command"
          ZIP_PATH="$RUNNER_TEMP/Whisper-Tauri-aarch64.zip"
          (cd "$STAGING" && ditto -c -k --keepParent "$PKG_NAME" "$ZIP_PATH")
          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"
          ls -lh "$ZIP_PATH"

      - name: Upload installer zip to release (macOS)
        if: matrix.platform == 'macos-latest' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release'))
        run: gh release upload "$RELEASE_TAG" "$ZIP_PATH" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
