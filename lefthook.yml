pre-commit:
  parallel: false
  skip:
    - merge
    - rebase
  jobs:
    - name: biome
      glob: "src/**/*.{ts,tsx}"
      run: pnpm exec biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    - name: cargo-fmt
      glob: "src-tauri/**/*.rs"
      run: cargo fmt --manifest-path src-tauri/Cargo.toml
      stage_fixed: true
