<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bg)"/>

  <!-- Sound waveform (upper-left) -->
  <line x1="128" y1="140" x2="128" y2="216" stroke="#99f6e4" stroke-width="22" stroke-linecap="round" opacity="0.55"/>
  <line x1="180" y1="100" x2="180" y2="256" stroke="#99f6e4" stroke-width="22" stroke-linecap="round" opacity="0.65"/>
  <line x1="232" y1="120" x2="232" y2="236" stroke="#99f6e4" stroke-width="22" stroke-linecap="round" opacity="0.75"/>

  <!-- Text lines (lower-right) -->
  <line x1="280" y1="284" x2="420" y2="284" stroke="#ffffff" stroke-width="22" stroke-linecap="round"/>
  <line x1="280" y1="336" x2="392" y2="336" stroke="#ffffff" stroke-width="22" stroke-linecap="round" opacity="0.85"/>
  <line x1="280" y1="388" x2="408" y2="388" stroke="#ffffff" stroke-width="22" stroke-linecap="round" opacity="0.7"/>
</svg>
