<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background (OS applies platform mask: macOS squircle, Win/Linux square) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Single flowing waveform: ECG / speech-like, left-to-right -->
  <polyline points="50,256 70,230 92,285 116,230 138,205 160,220 196,106 220,406 248,220 268,305 296,200 320,320 348,195 376,290 412,235 444,272 462,256"
            fill="none" stroke="#e9d5ff" stroke-width="16"
            stroke-linejoin="round" stroke-linecap="round" opacity="0.95"/>
</svg>
